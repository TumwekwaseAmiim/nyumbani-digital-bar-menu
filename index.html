<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nyumbani Hotel — Bar Menu</title>

    <meta
        name="description"
        content="Nyumbani Hotel Bar Menu — Your Home Away From Home in Kampala."
    >

    <link
        rel="stylesheet"
        href="index.css"
    >

</head>


<body>

    <main class="landing-page">

        <!-- =================================================
             HOTEL LOGO
             ================================================= -->

        <img
            src="assets/images/logo.png"
            alt="Nyumbani Hotel Logo"
            class="hotel-logo"
        >


        <!-- =================================================
             HOTEL NAME
             ================================================= -->

        <h1>
            NYUMBANI HOTEL
        </h1>


        <!-- =================================================
             PAGE TITLE
             ================================================= -->

        <p class="page-title">
            BAR MENU
        </p>


        <!-- =================================================
             BAR IMAGE
             ================================================= -->

        <div class="bar-image-container">

            <img
                src="assets/images/bar2.JPG"
                alt="Nyumbani Hotel Bar"
                class="bar-image"
            >

        </div>


        <!-- =================================================
             WELCOME MESSAGE
             ================================================= -->

        <p class="welcome-text">
            Welcome to Nyumbani Hotel
        </p>


        <p class="subtitle">
            Your Home Away From Home in Kampala
        </p>


        <!-- =================================================
             MENU BUTTON
             ================================================= -->

        <a
            href="bar-menu.html"
            class="menu-button"

            VIEW BAR MENU
        </a>

    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <p>
            Nyumbani Hotel
        </p>

        <span>
            Your Home Away From Home in Kampala
        </span>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="index.js"></script>
